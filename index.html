<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#151310"><title>The Community Café — Menu Book</title><link rel="stylesheet" href="style.css"></head>
<body>
<main class="stage" aria-label="Café menu book">
<div class="book closed" id="book">
<div class="page left-page"><img id="left-image" alt=""></div>
<div class="page right-page"><img id="right-image" src="Cover.jpg" alt="The Community Café menu cover" fetchpriority="high"></div>
<div class="spine" aria-hidden="true"></div>
<div class="leaf" id="leaf" aria-hidden="true"><div class="leaf-front"><img id="front-image" alt=""></div><div class="leaf-back"><img id="back-image" alt=""></div></div>
<button class="touch-zone previous" id="previous" aria-label="Turn to previous menu page"></button><button class="touch-zone next" id="next" aria-label="Turn to next menu page"></button>
</div><span class="sr-only" id="page-status" aria-live="polite">Menu cover. Touch the right side or swipe left to open the book.</span>
</main><script src="app.js"></script>
</body></html>
